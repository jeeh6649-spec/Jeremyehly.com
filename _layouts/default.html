<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% include seo.html %}
{% include analytics.html %}
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" href="{{ '/assets/icons/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/assets/icons/favicon-32x32.png' | relative_url }}" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<meta name="theme-color" content="#1A1A18">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body{% if page.hero_shrink %} class="home-hero"{% endif %}>

{% include header.html %}

<main>
{{ content }}
</main>

{% include footer.html %}

{% if page.needs_lightbox %}
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close full-size view">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous image">&minus;</button>
  <div class="lightbox-media">
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>
  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next image">+</button>
</div>
<div class="zoom-lens" id="zoomLens"></div>
{% endif %}

<script src="{{ '/assets/js/site.js' | relative_url }}"></script>
{% if page.extra_js %}
<script src="{{ page.extra_js | relative_url }}"></script>
{% endif %}

</body>
</html>
